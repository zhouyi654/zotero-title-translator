name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate tag and metadata
        run: python scripts/check_release.py --tag "$GITHUB_REF_NAME"

      - name: Run tests
        run: npm test

      - name: Build XPI
        run: npm run build

      - name: Generate update manifest
        run: python scripts/generate_updates.py --tag "$GITHUB_REF_NAME"

      - name: Verify release artifacts
        run: python scripts/check_release.py --tag "$GITHUB_REF_NAME" --dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/zotero-title-translator-*.xpi \
            dist/updates.json \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
