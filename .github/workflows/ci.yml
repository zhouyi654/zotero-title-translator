name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run JavaScript tests
        run: npm test

      - name: Build and validate XPI
        run: python build_xpi.py --check

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotero-title-translator-xpi
          path: dist/*.xpi
