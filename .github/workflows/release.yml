name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate version and tests
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          test "$TAG" = "$MANIFEST_VERSION"
          npm test
          python build_xpi.py --check

      - name: Generate update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          XPI="dist/zotero-title-translator-${VERSION}.xpi"
          HASH="$(sha256sum "$XPI" | awk '{print $1}')"
          python - "$VERSION" "$HASH" <<'PY'
          import json
          import sys
          version, digest = sys.argv[1], sys.argv[2]
          owner = "zhouyi654"
          repo = "zotero-title-translator"
          plugin_id = "zotero-title-translator@zhouyi654.github.io"
          data = {
              "addons": {
                  plugin_id: {
                      "updates": [
                          {
                              "version": version,
                              "update_link": (
                                  f"https://github.com/{owner}/{repo}/"
                                  f"releases/download/v{version}/"
                                  f"zotero-title-translator-{version}.xpi"
                              ),
                              "update_hash": f"sha256:{digest}",
                              "applications": {
                                  "zotero": {
                                      "strict_min_version": "9.0",
                                      "strict_max_version": "9.0.*"
                                  }
                              }
                          }
                      ]
                  }
              }
          }
          with open("updates.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          XPI="dist/zotero-title-translator-${VERSION}.xpi"
          gh release create "${GITHUB_REF_NAME}" \
            "$XPI" \
            updates.json \
            --title "Zotero 标题翻译 ${VERSION}" \
            --generate-notes
