name: Bug 报告
description: 报告可复现的插件问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: 插件版本
      placeholder: 例如 0.3.6
    validations:
      required: true

  - type: input
    id: zotero
    attributes:
      label: Zotero 版本和操作系统
      placeholder: 例如 Zotero 9.0.6 / Windows 11
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: 翻译服务
      options:
        - MyMemory
        - Google Cloud Translation
        - DeepL
        - Microsoft Translator
        - LibreTranslate
        - Ollama
        - Qwen-MT
        - SiliconFlow
        - 火山方舟
        - DeepSeek
        - Gemini
        - OpenAI
        - 自定义 API
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 操作类型
      options:
        - 单篇翻译
        - 多篇翻译
        - 分类翻译
        - 整库翻译
        - 导入后自动翻译
        - 设置或安装
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: 实际结果和预期结果
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已经从日志和截图中删除 API Key、私人文献标题和个人数据。
          required: true
